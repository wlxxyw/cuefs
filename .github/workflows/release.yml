name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在，例如 v0.2.0）'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (linux/amd64)
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/cuefs-linux-amd64 ./cmd/cuefs

      - name: Build (linux/arm64)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/cuefs-linux-arm64 ./cmd/cuefs

      - name: Build (linux/arm)
        run: GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/cuefs-linux-arm ./cmd/cuefs

      - name: Checksums
        run: cd dist && sha256sum cuefs-linux-* > sha256sums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/cuefs-linux-amd64
            dist/cuefs-linux-arm64
            dist/cuefs-linux-arm
            dist/sha256sums.txt
